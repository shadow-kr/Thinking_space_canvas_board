<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23e12885' d='M16 2a9 9 0 0 0-5 16.5V22h10v-3.5A9 9 0 0 0 16 2z'/%3E%3Crect x='11' y='23.5' width='10' height='2.5' rx='1' fill='%23e12885'/%3E%3Crect x='13' y='27' width='6' height='2.5' rx='1.2' fill='%23e12885'/%3E%3C/svg%3E">
<style>
:root{--ink:#373b3e;--deep:#2b2f32;--mist:#bec8d1;--aqua:#86cecb;--teal:#137a7f;--pink:#e12885}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--mist)}
#board{position:fixed;inset:0;overflow:auto}
#world{position:relative;width:5000px;height:4000px;background-image:radial-gradient(rgba(190,200,209,.17) 1.3px,transparent 1.3px);background-size:26px 26px}
#wires{position:absolute;inset:0;width:5000px;height:4000px;pointer-events:none;z-index:0}
#wires .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#wires .line{fill:none;stroke:var(--aqua);stroke-width:2.5;pointer-events:none}
#wires .w:hover .line{stroke:var(--pink)}
#wires .tmp{fill:none;stroke:var(--pink);stroke-width:2.5;stroke-dasharray:6 5}
#bar{position:fixed;top:14px;left:14px;z-index:10000;display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--deep);border:1px solid rgba(190,200,209,.2);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#bar button{font:600 13px inherit;font-family:inherit;color:#fff;background:var(--teal);border:0;border-radius:9px;padding:7px 14px;cursor:pointer}
#bar button:hover{background:#19959b}
#bar label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
#bar input{accent-color:var(--pink);width:15px;height:15px}
#add{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:34px;line-height:1;cursor:pointer;z-index:10000;box-shadow:0 8px 24px rgba(225,40,133,.45);transition:transform .15s}
#add:hover{transform:translateX(-50%) scale(1.08)}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--deep);color:var(--aqua);padding:8px 16px;border-radius:10px;font-size:13px;z-index:10001;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
#empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:18px;opacity:.55}
.note{position:absolute;z-index:1}
.card{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.32);resize:both;overflow:auto;min-width:190px;min-height:110px;cursor:grab}
.hd{display:flex;align-items:center;gap:4px}
.hd input.ti{flex:1;min-width:0;font:700 15px inherit;font-family:inherit;color:inherit;background:rgba(255,255,255,.22);border:0;border-radius:8px;padding:6px 8px;outline:none}
.hd input.ti::placeholder{color:inherit;opacity:.55}
.hd input.col{width:26px;height:26px;padding:0;border:2px solid rgba(255,255,255,.6);border-radius:50%;background:none;cursor:pointer;flex:none}
.hd button{width:26px;height:26px;flex:none;border:0;border-radius:8px;background:rgba(0,0,0,.14);color:inherit;cursor:pointer;font-size:13px;padding:0}
.hd button:hover{background:rgba(0,0,0,.3)}
.hd button.del:hover{background:var(--pink);color:#fff}
.card textarea{flex:1;min-height:56px;resize:none;border:0;outline:none;background:rgba(255,255,255,.18);border-radius:8px;padding:8px;font:14px/1.45 inherit;font-family:inherit;color:inherit}
.card textarea::placeholder{color:inherit;opacity:.5}
.imgs{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.im{position:relative;resize:both;overflow:hidden;max-width:100%;min-width:40px;min-height:30px;border-radius:8px}
.im img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.im b{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(55,59,62,.85);color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;cursor:pointer}
.im:hover b{display:flex}
.im b:hover{background:var(--pink)}
.h{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--deep);border:2.5px solid var(--aqua);cursor:crosshair;z-index:2;transition:transform .12s}
.h:hover{background:var(--pink);border-color:#fff;transform:scale(1.3)}
.h.l{left:-9px}.h.r{right:-9px}
.note.bare .card{background:transparent!important;box-shadow:none;resize:none}
.note.bare .ti{display:none}
.note.bare .hd{justify-content:flex-end;opacity:0;transition:opacity .15s}
.note.bare:hover .hd{opacity:1}
.note.bare .card textarea{background:transparent}
.note.bare.hasimg textarea{display:none}
.note.bare .im{resize:both}
.note.bare .h{opacity:0}.note.bare:hover .h{opacity:1}
</style>
</head>
<body>
<div id="bar">
  <button id="save">Save</button>
  <button id="load">Load</button>
  <label title="Reuse the chosen file without asking again"><input type="checkbox" id="rem">Remember path</label>
</div>
<div id="board"><div id="world">
  <svg id="wires" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#86cecb"/></marker></defs></svg>
</div></div>
<div id="empty">Press + to add your first note</div>
<button id="add" title="Add sticky note">+</button>
<div id="toast"></div>
<input type="file" id="pick" accept="image/*" multiple hidden>
<input type="file" id="open" accept=".json,application/json" hidden>

<script>
const $=s=>document.querySelector(s), NS='http://www.w3.org/2000/svg';
const board=$('#board'), world=$('#world'), svg=$('#wires');
let S={notes:[],conns:[]}, z=1, pickTarget=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const COLORS=['#86cecb','#bec8d1','#f3a6c8','#a9ddd9'];
const isDark=c=>{const n=parseInt(c.slice(1),16);return .299*(n>>16)+.587*(n>>8&255)+.114*(n&255)<140};

/* ---------- storage (IndexedDB, survives closing the tab) ---------- */
const idb=new Promise((res,rej)=>{try{const q=indexedDB.open('canvas-board',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=rej}catch(e){rej(e)}});
const kv=(m,k,v)=>idb.then(d=>new Promise((res,rej)=>{const s=d.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv');const q=m==='get'?s.get(k):s.put(v,k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
let timer;const persist=()=>{clearTimeout(timer);timer=setTimeout(()=>kv('put','state',S).catch(()=>{}),250)};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)};
const empty=()=>$('#empty').style.display=S.notes.length?'none':'flex';

/* ---------- wires ---------- */
const anchor=(id,s)=>{const n=S.notes.find(x=>x.id===id);return n&&{x:n.x+(s==='r'?n.w:0),y:n.y+n.h/2}};
const curve=(a,as,b,bs)=>{const d=Math.max(60,Math.abs(b.x-a.x)/2),ax=a.x+(as==='r'?d:-d),bx=b.x+(bs==='r'?d:-d);return `M${a.x},${a.y}C${ax},${a.y} ${bx},${b.y} ${b.x},${b.y}`};
function drawWires(){
  svg.querySelectorAll('.w').forEach(e=>e.remove());
  S.conns.forEach(c=>{
    const a=anchor(c.a,c.as),b=anchor(c.b,c.bs);if(!a||!b)return;
    const d=curve(a,c.as,b,c.bs),g=document.createElementNS(NS,'g');
    g.setAttribute('class','w');
    g.innerHTML=`<path class="hit" d="${d}"/><path class="line" d="${d}" marker-end="url(#ah)"/>`;
    g.addEventListener('dblclick',()=>{S.conns=S.conns.filter(x=>x!==c);drawWires();persist();toast('Arrow deleted')});
    svg.append(g);
  });
}

/* ---------- notes ---------- */
function paint(n,el){
  const card=el.firstChild;
  el.style.left=n.x+'px';el.style.top=n.y+'px';
  card.style.background=n.color;card.style.color=isDark(n.color)?'#fff':'#262a2d';
  el.classList.toggle('bare',!!n.bare);el.classList.toggle('hasimg',n.imgs.length>0);
}
function renderImgs(n,el){
  const box=el.querySelector('.imgs');box.innerHTML='';
  n.imgs.forEach(im=>{
    const w=document.createElement('div');w.className='im';w.style.width=im.w+'px';if(im.h)w.style.height=im.h+'px';
    w.innerHTML=`<img draggable="false" src="${im.src.replace(/"/g,'%22')}"><b title="Remove image">✕</b>`;
    w.querySelector('b').onclick=()=>{n.imgs=n.imgs.filter(x=>x!==im);renderImgs(n,el);paint(n,el);persist()};
    new ResizeObserver(()=>{const W=w.offsetWidth,H=w.offsetHeight;if(W&&(Math.abs(W-im.w)>1||Math.abs(H-(im.h||0))>1)){im.w=W;im.h=H;persist()}}).observe(w);
    box.append(w);
  });
}
function addImg(n,el,src){
  const i=new Image();
  i.onload=()=>{n.imgs.push({src,w:Math.min(i.naturalWidth,Math.max(120,n.w-30))});renderImgs(n,el);paint(n,el);persist()};
  i.onerror=()=>toast('Could not load that image');
  i.src=src;
}
function mk(n){
  const el=document.createElement('div');el.className='note';el.dataset.id=n.id;
  el.innerHTML=`<div class="card"><div class="hd"><input class="ti" placeholder="Title"><input class="col" type="color" title="Note color"><button class="pin" title="Import images from this computer">📌</button><button class="bare" title="Show only the images (hide background and title)">◐</button><button class="del" title="Delete note">✕</button></div><div class="imgs"></div><textarea placeholder="Write, or paste text, image links and images"></textarea></div><i class="h l" title="Drag to connect"></i><i class="h r" title="Drag to connect"></i>`;
  const card=el.firstChild,ti=el.querySelector('.ti'),ta=el.querySelector('textarea'),col=el.querySelector('.col');
  ti.value=n.title;ta.value=n.text;col.value=n.color;
  card.style.width=n.w+'px';card.style.height=n.h+'px';
  paint(n,el);renderImgs(n,el);
  ti.oninput=()=>{n.title=ti.value;persist()};
  ta.oninput=()=>{n.text=ta.value;persist()};
  col.oninput=()=>{n.color=col.value;paint(n,el);persist()};
  el.querySelector('.bare').onclick=()=>{n.bare=!n.bare;paint(n,el);persist()};
  el.querySelector('.pin').onclick=()=>{pickTarget={n,el};$('#pick').click()};
  el.querySelector('.del').onclick=()=>{S.notes=S.notes.filter(x=>x!==n);S.conns=S.conns.filter(c=>c.a!==n.id&&c.b!==n.id);el.remove();drawWires();empty();persist()};
  new ResizeObserver(()=>{const w=card.offsetWidth,h=card.offsetHeight;if(w&&(w!==n.w||h!==n.h)){n.w=w;n.h=h;drawWires();persist()}}).observe(card);

  // paste images / image links
  el.addEventListener('paste',e=>{
    const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));
    if(files.length){e.preventDefault();files.forEach(f=>readImg(f,n,el));return}
    const t=(e.clipboardData?.getData('text')||'').trim();
    if(/^(https?:\/\/\S+\.(png|jpe?g|gif|webp|svg|avif|bmp)(\?\S*)?|data:image\/\S+)$/i.test(t)){e.preventDefault();addImg(n,el,t)}
  });

  // move
  card.addEventListener('pointerdown',e=>{
    if(!e.target.matches('.card,.hd,img'))return;
    if(e.target===card&&(e.offsetX>card.clientWidth-20||e.offsetY>card.clientHeight-20))return;
    e.preventDefault();el.style.zIndex=++z;
    const sx=e.clientX,sy=e.clientY,ox=n.x,oy=n.y;
    const mv=e=>{n.x=Math.max(0,ox+e.clientX-sx);n.y=Math.max(0,oy+e.clientY-sy);paint(n,el);drawWires()};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);persist()};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });

  // connect
  el.querySelectorAll('.h').forEach(h=>h.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    const side=h.classList.contains('l')?'l':'r',a=anchor(n.id,side);
    const tmp=document.createElementNS(NS,'path');tmp.setAttribute('class','tmp');svg.append(tmp);
    const pt=e=>{const r=world.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
    const mv=e=>{const p=pt(e);tmp.setAttribute('d',curve(a,side,p,p.x>a.x?'l':'r'))};
    const up=e=>{
      removeEventListener('pointermove',mv);removeEventListener('pointerup',up);tmp.remove();
      const hit=document.elementFromPoint(e.clientX,e.clientY),tn=hit&&hit.closest('.note');
      if(tn&&tn!==el){
        const m=S.notes.find(x=>x.id===tn.dataset.id);
        const bs=hit.classList.contains('h')?(hit.classList.contains('l')?'l':'r'):(pt(e).x<m.x+m.w/2?'l':'r');
        S.conns.push({id:uid(),a:n.id,as:side,b:m.id,bs});drawWires();persist();
      }
    };
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  }));
  world.append(el);
}
function readImg(file,n,el){const r=new FileReader();r.onload=()=>addImg(n,el,r.result);r.readAsDataURL(file)}
function renderAll(){world.querySelectorAll('.note').forEach(e=>e.remove());S.notes.forEach(mk);drawWires();empty()}

$('#add').onclick=()=>{
  const j=()=>Math.round((Math.random()-.5)*60);
  const n={id:uid(),x:Math.max(0,board.scrollLeft+board.clientWidth/2-130+j()),y:Math.max(0,board.scrollTop+board.clientHeight/2-130+j()),w:260,h:220,title:'',text:'',color:COLORS[S.notes.length%COLORS.length],bare:false,imgs:[]};
  S.notes.push(n);mk(n);empty();persist();
  const el=world.lastChild;el.style.zIndex=++z;el.querySelector('.ti').focus();
};
$('#pick').onchange=e=>{if(pickTarget)[...e.target.files].forEach(f=>readImg(f,pickTarget.n,pickTarget.el));e.target.value=''};

/* ---------- save / load with remembered path ---------- */
const rem=$('#rem');
try{rem.checked=localStorage.getItem('cb-rem')==='1'}catch{}
rem.onchange=()=>{try{localStorage.setItem('cb-rem',rem.checked?'1':'0')}catch{} if(!rem.checked)kv('put','handle',null).catch(()=>{})};
const types=[{description:'Board file',accept:{'application/json':['.json']}}];
async function getHandle(mode){
  let h=rem.checked?await kv('get','handle').catch(()=>null):null;
  if(h){try{const o={mode:'readwrite'};if(await h.queryPermission(o)!=='granted'&&await h.requestPermission(o)!=='granted')h=null}catch{h=null}}
  if(!h){
    h=mode==='save'?await showSaveFilePicker({suggestedName:'board.json',types}):(await showOpenFilePicker({types}))[0];
    if(rem.checked)kv('put','handle',h).catch(()=>{});
  }
  return h;
}
function download(data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='board.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Downloaded board.json')}
function loadText(t){
  try{const d=JSON.parse(t);if(!Array.isArray(d.notes))throw 0;S={notes:d.notes,conns:d.conns||[]};S.notes.forEach(n=>n.imgs=n.imgs||[]);renderAll();persist();toast('Board loaded')}
  catch{toast('That file is not a valid board')}
}
$('#save').onclick=async()=>{
  const data=JSON.stringify(S);
  try{
    if(!window.showSaveFilePicker)throw 0;
    const h=await getHandle('save');
    const w=await h.createWritable();await w.write(data);await w.close();toast('Board saved');
  }catch(e){if(e&&e.name==='AbortError')return;download(data)}
};
$('#load').onclick=async()=>{
  try{
    if(!window.showOpenFilePicker)throw 0;
    const h=await getHandle('load');
    loadText(await(await h.getFile()).text());
  }catch(e){if(e&&e.name==='AbortError')return;$('#open').click()}
};
$('#open').onchange=async e=>{const f=e.target.files[0];if(f)loadText(await f.text());e.target.value=''};

/* ---------- boot ---------- */
kv('get','state').then(s=>{if(s&&Array.isArray(s.notes))S=s}).catch(()=>{}).finally(renderAll);
</script>
</body>
</html>
